---
# 1. The Deployment (The Task)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: iot-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: iot-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: iot-config
        - secretRef:
            name: iot-secrets
---
# 2. The Service (The Target Group)
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: iot-platform
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000 # The uvicorn port
