services:
  kafka:
    image: apache/kafka:4.0.2-rc3
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT

      # Cluster ID (required for KRaft)
      KAFKA_CLUSTER_ID: "MkU2Y2YxYmU2YmU0YmU0Ym"

      # Misc
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_BYTES: 524288000 # 500 MB (500 * 1024 * 1024)
    networks:
      - iot-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - iot-network

  postgres:
    image: timescale/timescaledb:2.25.2-pg17
    container_name: postgres
    environment:
      - POSTGRES_USER=obaidullah.faruk05
      - POSTGRES_PASSWORD=admin@123
      - POSTGRES_DB=iot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - iot-network

  pgadmin:
    image: dpage/pgadmin4:9.13.0
    container_name: pgadmin
    depends_on:
      - postgres
    environment:
      - PGADMIN_DEFAULT_EMAIL=obaidullah.faruk05@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=admin@123
    ports:
      - "5050:80"
    networks:
      - iot-network

  simulator:
    build:
      context: ../../services/simulator
    container_name: simulator
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: iot.telemetry
      DEVICE_ID: thermal_sensor_01
    networks:
      - iot-network

  worker:
    build:
      context: ../../
      dockerfile: services/worker/Dockerfile
    container_name: worker
    depends_on:
      - kafka
      - postgres
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: iot.telemetry
      KAFKA_GROUP_ID: iot-worker-group
      POSTGRES_USER: obaidullah.faruk05
      POSTGRES_PASSWORD: admin@123
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: iot_db
    networks:
      - iot-network

  api:
    build:
      context: ../../
      dockerfile: services/api/Dockerfile
    container_name: api
    depends_on:
      - postgres
    environment:
      POSTGRES_USER: obaidullah.faruk05
      POSTGRES_PASSWORD: admin@123
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: iot_db
    ports:
      - "8000:8000"
    networks:
      - iot-network

networks:

  iot-network:
    driver: bridge

volumes:
  postgres_data:
